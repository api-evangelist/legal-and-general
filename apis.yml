name: Legal & General
kind: company
description: >-
  Legal & General Group plc is a FTSE 100 United Kingdom life insurer, retirement
  and institutional asset manager headquartered in London and regulated by the
  FCA and PRA. Its lines of business are life and protection insurance (term
  life, critical illness, income protection), workplace and individual pensions,
  annuities and bulk-purchase annuity/pension risk transfer, equity release
  through Legal & General Home Finance, and asset management through Legal &
  General Investment Management. It is a life and health carrier rather than a
  general insurer, and it distributes almost entirely through regulated
  intermediaries — financial advisers, mortgage brokers and employee-benefit
  consultants — rather than direct-to-developer. Its API posture reflects that
  distribution model honestly: Legal & General publishes NO public, self-serve
  developer portal, no public API reference, and no downloadable OpenAPI or
  Swagger definition. No developer.legalandgeneral.com, developers, docs, or
  api subdomain resolves in DNS, and /developers, /api, /developer, /partners
  and /integrations all return HTTP 404 on the primary site. Every documented
  Legal & General API is a bilateral, partner-gated integration announced by the
  counterparty rather than published by Legal & General — real-time equity
  release quotation, KFI and application APIs wired into Iress "The Exchange",
  Air Sourcing and the Advise Wise platform, a Mortgage Club integration with
  Kensington Mortgages, and adviser-facing protection quote-and-apply through
  OLP Connect. Adviser identity and messaging run on the UK's Origo rails —
  Unipass digital certificates, Unipass Letter of Authority and Origo Track My
  Apps — which is the UK life and pensions analogue of ACORD; no ACORD, AL3,
  ACORD XML or NGDS reference appears anywhere in Legal & General's public
  surface. The only public Legal & General code is the Canopy design system on
  GitHub — an Apache-2.0 Angular component library shipped through GitHub
  Packages, with dated semver release notes, a published breaking-change policy,
  a repository security policy, and 84 installable agent skills (69 component
  best-practice skills and 15 per-major migration skills) that work with GitHub
  Copilot, Claude Code and Cursor. That makes Legal & General agent-native on the
  front end and completely closed on the API. This record exists to measure that
  split accurately: a large carrier whose integration surface is entirely
  intermediary-gated and invisible from outside a login wall.
