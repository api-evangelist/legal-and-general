marketContext: >-
  Home market United Kingdom. The FCA and PRA impose no open-insurance
  obligation on UK carriers; the FCA's Open Finance work remains consultation,
  not rule. The UK's only market-wide API and data infrastructure effort is the
  London Market's Blueprint Two programme (PPL, Whitespace, Ki), and it is aimed
  at brokers and syndicates rather than developers. Legal & General is a life,
  health and pensions carrier, entirely outside that London Market subscription
  seam, and its integration rails are Origo/Unipass. The result is exactly the
  pattern this data set exists to measure: real APIs, real integrations, zero
  public developer surface.
actions:
  openapiDirectoryCreated: false
  apisYmlApisCount: 0
  reason: >-
    apis[] is intentionally EMPTY. No real, documented, publicly accessible
    Legal & General API exists to list. Recording the partner-gated absence
    accurately is the correct outcome for this carrier.
