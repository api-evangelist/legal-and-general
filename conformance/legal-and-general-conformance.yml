scope: >-
  Standards posture for a provider with no public API. Most API-side standards
  are recorded as conforms:false because there is no machine-readable contract
  to conform WITH — that is a measurement of absence, not a failure grade. The
  standards Legal & General genuinely does participate in are UK life-and-pensions
  messaging (Origo/Unipass), accessibility (WCAG), and semantic versioning for
  its published design system.
