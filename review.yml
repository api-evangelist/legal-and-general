aid: legal-and-general
name: Legal & General
review:
  question: Does Legal & General expose a real, public, self-serve developer portal
    or downloadable API definitions for its insurance products?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: United Kingdom
  tier: carrier-life-health
  gated: true
findings:
  summary: |
    Legal & General publishes NO public developer portal, NO public API
    reference, and NO downloadable OpenAPI/Swagger definition. Every
    conventional developer host was probed on 2026-07-25 and none resolves:
    developer., developers., docs., api. and apis..legalandgeneral.com all
    return no DNS answer (curl exit 000). On the primary site, /developers,
    /api, /developer, /partners and /integrations all return HTTP 404, while
    the site root returns HTTP 200. /openapi.json, /swagger.json and /api-docs
    return HTTP 404. /.well-known/openid-configuration and
    /.well-known/oauth-authorization-server both return HTTP 404 on the
    primary host — no anonymous OIDC/OAuth discovery document is served.

    The nearest thing to an integration surface is the adviser area at
    https://www.legalandgeneral.com/adviser/ (HTTP 200), which is a
    LOGIN WALL, not a developer portal: it carries Login and Register links,
    states it "is designed to give professional financial advisers information
    and tools ... and should not be relied upon by private investors", and
    exposes no reference documentation, no schemas and no self-serve
    credentials. Classified as (b) partner/agent login wall.

    Legal & General's real APIs exist, but they are bilateral and announced by
    the COUNTERPARTY rather than published by Legal & General. Confirmed from
    Legal & General's own newsroom (HTTP 200): Legal & General Home Finance
    provides "real time Equity Release Quotations, KFIs and Applications"
    into Iress' adviser portal "The Exchange"; equivalent API links exist into
    the Air Sourcing platform and the Advise Wise platform; and Legal & General
    Mortgage Club launched an API integration with Kensington Mortgages. None
    of these is obtainable by an unaffiliated developer — they are integrations
    into named adviser-software platforms.

    On the protection side, adviser quote-and-apply runs through OLP Connect
    and the Existing Business Agent Hub, reached from
    https://www.legalandgeneral.com/adviser/protection/services/registration-services/
    (HTTP 200). That page documents end-user functionality (quotes,
    applications, dynamic underwriting instant decisions, digital Declaration
    of Health, trusts, direct debit changes, policy cancellation) and contains
    no technical integration specification, no API documentation and no
    self-serve signup; onboarding is via a Business Development Manager or
    agency.enquiries@landg.com.

    The only public Legal & General code is a front-end design system, not an
    API: the GitHub organisation https://github.com/Legal-and-General (HTTP 200)
    holds three public repositories — canopy (Angular design system),
    canopy-design-tokens, and dependabot-batcher. No API definitions, no SDKs,
    no specs.
