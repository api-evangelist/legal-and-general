  specs:
    openapiHarvested: false
    count: 0
    note: >-
      No OpenAPI, Swagger, AsyncAPI, GraphQL SDL, .proto or Postman collection
      was found in any public Legal & General surface. The openapi/ directory is
      deliberately omitted from this repo because nothing real exists to save.
  acord:
    posture: no ACORD reference found; UK adviser messaging runs on Origo/Unipass instead
    detail: >-
      No occurrence of ACORD, AL3, ACORD XML, ACORD certified or NGDS was found
      anywhere in Legal & General's public web surface, documentation, newsroom
      or GitHub organisation. This is expected: ACORD's AL3/IVANS agency-download
      rails are a US property-and-casualty phenomenon, and Legal & General is a
      UK life, health and pensions carrier. The functional UK equivalent it does
      use is Origo — the UK life and pensions standards and messaging body.
      Legal & General adopted Origo's Unipass Letter of Authority for its
      workplace pensions business, supports Unipass digital certificates as
      adviser identity for OLP Connect and Adviser Centre access, and launched
      Origo Track My Apps for adviser case tracking. Origo publishes APIs to its
      member firms; Legal & General consumes and participates rather than
      publishing.
    standardsBodies:
    - Origo (UK life and pensions messaging and Unipass identity)
    ivans: not applicable — no US P&C agency-download surface
  insuranceVerbs:
    quote:
      exposed: true
      access: partner-only
      note: >-
        Real-time equity release quotations from Legal & General Home Finance are
        exposed through named adviser platforms (Iress "The Exchange", Air
        Sourcing, Advise Wise). Protection quotes run through OLP Connect behind
        adviser login. Not obtainable by an unaffiliated developer.
    bind:
      exposed: true
      access: partner-only
      note: >-
        Application submission (including KFIs for equity release) is carried by
        the same partner integrations and by OLP Connect. No public API.
    issue:
      exposed: false
      access: none
      note: >-
        Policy issuance is internal. No public or documented issuance API; case
        progress is surfaced to advisers via Origo Track My Apps and the
        Existing Business Agent Hub, not via a published API.
    fnol:
      exposed: false
      access: none
      note: >-
        No first-notice-of-loss / claims API surface of any kind is documented.
        Life and protection claims are initiated by phone and form.
  auth:
    model: >-
      No public API authentication scheme is documented. Adviser access to OLP
      Connect and the Adviser Centre is username/password with optional Unipass
      digital certificate (X.509 client certificate) association as a stronger
      adviser identity. Partner API integrations are established bilaterally with
      the platform vendor; their credentialing is not published.
    schemes:
    - type: Session login (username/password)
      surface: adviser and customer portals
      documented: true
    - type: Unipass digital certificate (X.509 client certificate, Origo)
      surface: adviser identity for OLP Connect / Adviser Centre
      documented: true
    - type: OAuth2 / OIDC
      documented: false
      note: No anonymous discovery document served at /.well-known on the primary host (HTTP 404).
    - type: API key
      documented: false
      note: No public API key issuance exists.
    - type: mTLS
      documented: false
      note: Bilateral partner transport is undisclosed; Unipass certificates are adviser identity, not a documented API transport.
  webhooks:
    present: false
    asyncapi: false
    note: >-
      No event catalog, webhook documentation or AsyncAPI definition is
      published. Adviser notifications are delivered as email alerts (lapse,
      bounced payment, cancellation) from OLP Connect, not as subscribable
      events. Absence is the finding.
  postman:
    present: false
    note: No public Postman workspace or collection was found for Legal & General.
  graphql:
    present: false
    note: No public /graphql surface was found; nothing to introspect.
  grpc:
    present: false
    note: No published .proto files.
  transports:
  - protocol: REST
    documented: false
    note: >-
      REST APIs demonstrably exist (partner integrations into Iress, Air
      Sourcing, Advise Wise, Kensington) but no base URL, reference or schema is
      published by Legal & General.
  - protocol: GraphQL
    documented: false
  - protocol: gRPC
    documented: false
  - protocol: WebSocket
    documented: false
  - protocol: SSE
    documented: false
  - protocol: File/EDI
    documented: false
    note: >-
      No ACORD AL3 or IVANS download surface. Origo message exchange for Letter
      of Authority and application tracking is member-to-member, not public.
